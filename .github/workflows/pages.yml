# Build the single-file game and publish it to GitHub Pages.
#
# Enable Pages on the repository with Source = GitHub Actions and a push to main redeploys
# https://ssinnott.github.io/foodie-truck/ . Every push and pull request builds; only main deploys.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax and type checks
        run: npm run lint
      - name: Net protocol and lockstep tests
        run: npm run nettest
      - name: Build the single-file game
        run: npm run build
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp dist/index.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
